services:
  projectzomboid-config:
    image: alpine:latest
    container_name: projectzomboid-config
    restart: "no"
    environment:
      SERVER_NAME: "MLTSF"
      SERVER_PASSWORD: ${SERVER_PASSWORD}
      MODS: "KnoxBuildworks;ElyonLib;KnoxBuildworksVanillaExpanded;hand-bag-window-climb;FixedLightOnBeltAF;MarzVanillaGuns;SWMG;HBAmmoCraft;HBVCEFb42;HBTacReload;StatZContinued;SpawnSelector;ProximityInventory;ProjectExile;Ladders42204;EQUIPMENT_UI;UsefulPallets;VanillaVehiclesAnimated;NepWreckWorkingCars"
      WORKSHOP_ITEMS: "2847184718;2950902979;3384377738;3389093252;3610677934;3629835761;3637486686;3722064198;3772052709;3772269882;3773834525;3778709615;3790259769;3813053718;3281755175;3428369137"
      XP_MULTIPLIER: "6.0"
      CHARACTER_FREE_POINTS: "40"
    command:
      - sh
      - -c
      - |
        mkdir -p /config/Server
        ini="/config/Server/$${SERVER_NAME}.ini"
        touch "$$ini"
        set_ini() {
          if grep -q "^$$1=" "$$ini"; then
            sed -i "s|^$$1=.*|$$1=$$2|" "$$ini"
          else
            echo "$$1=$$2" >> "$$ini"
          fi
        }
        set_ini Password "$${SERVER_PASSWORD}"
        set_ini Mods "$${MODS}"
        set_ini WorkshopItems "$${WORKSHOP_ITEMS}"
        sandbox="/config/Server/$${SERVER_NAME}_SandboxVars.lua"
        if [ -f "$$sandbox" ]; then
          sed -i "s|^\( *\)Global = .*|\1Global = $${XP_MULTIPLIER},|" "$$sandbox"
          sed -i "s|^\( *\)CharacterFreePoints = .*|\1CharacterFreePoints = $${CHARACTER_FREE_POINTS},|" "$$sandbox"
        fi
        chown -R 1000:1000 /config
    volumes:
      - /home/${HOST_USER}/projectzomboid/server-data:/config

  projectzomboid:
    image: indifferentbroccoli/projectzomboid-server-docker:latest
    container_name: projectzomboid-server
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      projectzomboid-config:
        condition: service_completed_successfully
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
    environment:
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RCON_PASSWORD: ${RCON_PASSWORD}
      SERVER_NAME: "MLTSF"
      MAX_PLAYERS: "4"
      MEMORY_XMX_GB: "6"
      UPDATE_ON_START: "true"
      STEAM_VAC: "true"
      USE_STEAM: "true"
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Berlin"
    volumes:
      - /home/${HOST_USER}/projectzomboid/server-files:/project-zomboid
      - /home/${HOST_USER}/projectzomboid/server-data:/project-zomboid-config
